<div class="page-header">
    <h1><i class="fas fa-calculator"></i> Планирование обработки</h1>
    <p>Расчёт параметров хранения и сушки с учётом базисных показателей культуры</p>
</div>
<div class="container mx-auto px-4 pb-20">
    <div class="grid lg:grid-cols-2 gap-8">
        <div class="card-panel">
            <h2 class="text-xl font-bold mb-4">Стоимость хранения после обработки</h2>
            <div class="form-group">
                <label>Культура</label>
                <select id="grainType" class="input-field" onchange="calculateStorage()"></select>
            </div>
            <div id="grainInfoPanel" class="info-panel mb-4 text-sm"></div>
            <div class="grid grid-cols-2 gap-4">
                <div class="form-group"><label>Масса, т</label><input type="number" id="volume" min="1" value="100" class="input-field" oninput="calculateStorage()"></div>
                <div class="form-group"><label>Срок, мес</label><input type="number" id="duration" min="1" max="24" value="3" class="input-field" oninput="calculateStorage()"></div>
            </div>
            <div class="form-group"><label>Влажность после сушки, %</label><input type="number" id="moisture" min="10" max="35" value="14" step="0.1" class="input-field" oninput="calculateStorage()"></div>
            <div id="moistureWarning" class="alert alert-info mb-4"></div>
            <div class="price-box">
                <p class="text-sm text-gray-600">Оценка</p>
                <p class="price-value" id="storagePrice">0 ₽</p>
                <p class="text-sm text-gray-500" id="priceDetails"></p>
            </div>
        </div>
        <div class="card-panel">
            <h2 class="text-xl font-bold mb-4">Режим сушки (первичная)</h2>
            <div class="form-group"><label>Влажность до сушки, %</label><input type="number" id="moistureStart" value="20" step="0.1" class="input-field" oninput="calculateDrying()"></div>
            <div class="form-group"><label>Целевая влажность, %</label><input type="number" id="moistureEnd" value="14" step="0.1" class="input-field" oninput="calculateDrying()"></div>
            <div class="form-group"><label>Масса партии, т</label><input type="number" id="dryingVolume" value="50" class="input-field" oninput="calculateDrying()"></div>
            <div class="price-box price-box-blue">
                <p class="text-sm text-gray-600">Стоимость сушки</p>
                <p class="price-value text-blue-600" id="dryingPrice">0 ₽</p>
                <p class="text-sm">Δ влажности: <strong id="moistureReduction">0</strong>% · ~<strong id="dryingTime">0</strong> ч</p>
                <p class="text-xs text-gray-500 mt-1" id="fuelEstimate"></p>
            </div>
        </div>
    </div>
</div>
