<div class="page-header">
    <h1>Контакты</h1>
    <p>Свяжитесь с диспетчерской или приемной</p>
</div>
<div class="container mx-auto px-4 pb-20">
    <div class="grid md:grid-cols-2 gap-12">
        <div class="space-y-6">
            <div class="contact-row">
                <div class="contact-icon"><i class="fas fa-location-dot"></i></div>
                <div>
                    <h4 class="font-bold">Адрес</h4>
                    <p>412340, Саратовская обл., г. Балашов, ул. Привокзальная, 1</p>
                </div>
            </div>
            <div class="contact-row">
                <div class="contact-icon"><i class="fas fa-phone"></i></div>
                <div>
                    <h4 class="font-bold">Телефон</h4>
                    <p>+7 (84545) 4-XX-XX (приемная)</p>
                </div>
            </div>
            <div class="contact-row">
                <div class="contact-icon"><i class="fas fa-envelope"></i></div>
                <div>
                    <h4 class="font-bold">Email</h4>
                    <p>info@balashov-hb.ru</p>
                </div>
            </div>
            <div class="contact-row">
                <div class="contact-icon"><i class="fas fa-clock"></i></div>
                <div>
                    <h4 class="font-bold">Режим</h4>
                    <p>Пн–Пт: 08:00–17:00 · Приемка в сезон: круглосуточно</p>
                </div>
            </div>
        </div>
        <div class="card-panel">
            <form id="contactForm">
                <div class="form-group">
                    <label>Ваше имя</label>
                    <input type="text" required class="input-field">
                </div>
                <div class="form-group">
                    <label>Телефон / Email</label>
                    <input type="text" required class="input-field">
                </div>
                <div class="form-group">
                    <label>Сообщение</label>
                    <textarea rows="4" required class="input-field"></textarea>
                </div>
                <button type="submit" class="btn-primary w-full">Отправить</button>
            </form>
        </div>
    </div>
</div>
