<div class="page-header page-header-compact">
    <h1>Личный кабинет</h1>
</div>
<div class="container mx-auto px-4 pb-20 max-w-md">
    <div class="card-panel">
        <div class="text-center mb-8">
            <i class="fas fa-wheat-awn text-amber-600 text-5xl mb-4"></i>
                    <p class="text-gray-600">Доступ к мониторингу и управлению процессами</p>
        </div>
        <div class="flex mb-6 bg-gray-100 rounded-lg p-1">
            <button type="button" id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 rounded-md bg-white shadow text-sm font-semibold">Вход</button>
            <button type="button" id="tabRegisterBtn" onclick="switchAuthTab('register')" class="flex-1 py-2 rounded-md text-sm font-semibold text-gray-600">Регистрация</button>
        </div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="loginUsername" required class="input-field">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="loginPassword" required class="input-field">
            </div>
            <button type="submit" class="btn-primary w-full">Войти</button>
        </form>
        <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
            <div class="form-group"><label>Логин</label><input type="text" id="registerUsername" required class="input-field"></div>
            <div class="form-group"><label>ФИО</label><input type="text" id="registerFullName" required class="input-field"></div>
            <div class="form-group"><label>Организация / предприятие</label><input type="text" id="registerOrganization" required class="input-field" placeholder="ООО, ИП, хозяйство…"></div>
            <div class="form-group"><label>Email</label><input type="email" id="registerEmail" class="input-field"></div>
            <div class="form-group"><label>Телефон</label><input type="text" id="registerPhone" class="input-field"></div>
            <div class="form-group"><label>Пароль</label><input type="password" id="registerPassword" required class="input-field"></div>
            <p class="text-xs text-gray-500 mb-3">После регистрации администратор проверит заявку и откроет доступ.</p>
            <button type="submit" class="btn-dark w-full">Создать аккаунт</button>
        </form>
        <div class="mt-6 text-center text-sm text-gray-500">
            <p>Демо: <span class="font-mono">admin / demo123</span></p>
        </div>
    </div>
</div>
